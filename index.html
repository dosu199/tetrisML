<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="nav.css">
    <title>Tetris</title>
</head>

<body>
    <nav class="topnav" aria-label="Main">
      <a class="topnav-brand" href="index.html"><span class="topnav-logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>Tetris ML</span></a>
      <ul class="topnav-links">
        <li><a href="index.html" aria-current="page">Play</a></li>
        <li><a href="versus.html">Play vs Bot</a></li>
        <li><a href="presentation.html">How it works</a></li>
        <li><a href="learning.html">Watch it learn</a></li>
      </ul>
    </nav>

    <div id="wrapper">
        <div class="board-wrap">
            <div id="gameContainer"></div>
            <div class="play-overlay intro" id="playOverlay" hidden>
                <div class="intro-fall" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
                <div class="intro-box">
                    <p class="play-overlay-title intro-title" id="playTitle">Ready to play?</p>
                    <div id="playText"></div>
                    <button type="button" class="btn-go" id="playGo">Start</button>
                </div>
            </div>
        </div>
        <div id="gameStuff">
            <div id="holdTetromino"></div>
            <div id="nextTetromino">
            </div>
            <div id="score">
                <div id="name">Score</div>
                <div id="scoreBoard">0</div>
            </div>
            <div class="agent-panel">
  <label class="ml-switch">
    <input type="checkbox" id="mlToggle" role="switch">
    <span class="ml-track" aria-hidden="true"><span class="ml-thumb"></span></span>
    <span class="ml-text">Turn on ML</span>
  </label>
  <p class="ml-hint" id="mlHint">Off: you play. On: the network plays.</p>
  <label for="agent">Who plays</label>
  <select id="agent">
    <option value="dqn3">Neural network + deep lookahead</option>
    <option value="dqn2">Neural network + lookahead</option>
    <option value="dqn">Neural network (DQN)</option>
    <option value="bot">Bot (search)</option>
  </select>
  <div id="agentStats"></div>
  <ul class="keys-hint" id="keysHint">
    <li><kbd>←</kbd><kbd>→</kbd> move</li>
    <li><kbd>↑</kbd>/<kbd>X</kbd> rotate, <kbd>Z</kbd> back</li>
    <li><kbd>↓</kbd> soft drop, <kbd>Space</kbd> hard drop</li>
    <li><kbd>C</kbd>/<kbd>Shift</kbd> hold, <kbd>P</kbd> pause</li>
  </ul>
</div>
        </div>
    </div>

    <!-- touch controls (phones and tablets, only while you play) -->
    <div class="touch-pad" id="touchPad" aria-label="Touch controls">
        <button type="button" data-key="hold">Hold</button>
        <button type="button" data-key="ccw" aria-label="Rotate left">⟲</button>
        <button type="button" data-key="cw" aria-label="Rotate right">⟳</button>
        <button type="button" data-key="pause" aria-label="Pause">❚❚</button>
        <button type="button" data-key="left" aria-label="Move left">◀</button>
        <button type="button" data-key="down" aria-label="Move down">▼</button>
        <button type="button" data-key="right" aria-label="Move right">▶</button>
        <button type="button" data-key="drop" aria-label="Drop">Drop</button>
    </div>

<script type="module">
  import { startVisualGame } from './src/tetris-visual.js';
  import { chooseMoveAction } from './src/tetris-ai.js';
  import { loadDqn, chooseDqnAction } from './src/tetris-dqn.js';

  const $ = (id) => document.getElementById(id);
  const json = (f) => fetch(f).then((r) => r.json());
  const weights = (await json('./weights.json')).weights;
  const net = loadDqn(await json('./dqn-model.json'));

  // every player may use the hold box: `hold` is { held, canHold }
  const choosers = {
    dqn3: (board, cur, next, hold) => chooseDqnAction(board, cur, net, next, hold, { deep: true }),
    dqn2: (board, cur, next, hold) => chooseDqnAction(board, cur, net, next, hold, { lookahead: true }),
    dqn: (board, cur, next, hold) => chooseDqnAction(board, cur, net, next, hold),
    bot: (board, cur, next, hold) => chooseMoveAction(board, cur, next, weights, hold, { lookahead: true }),
  };

  // remember which agent you picked last time (optional nicety)
  const saved = (() => {
    try {
      return JSON.parse(localStorage.getItem('tetris-play') || '{}');
    } catch {
      return {};
    }
  })();
  const save = () => {
    try {
      localStorage.setItem('tetris-play', JSON.stringify({ agent: $('agent').value }));
    } catch {}
  };
  if (saved.agent && choosers[saved.agent]) $('agent').value = saved.agent;
  $('mlToggle').checked = false; // you always start playing yourself

  const coarse = window.matchMedia('(pointer: coarse)').matches;
  const READY_TEXT = coarse
    ? '<p class="intro-sub">You play. Turn on ML below to let the network play instead.</p>'
    : `<p class="intro-sub">You play. Turn on ML to let the network play instead.</p>
       <ol class="intro-steps">
         <li><span><kbd>←</kbd><kbd>→</kbd> move, <kbd>↑</kbd> rotate</span></li>
         <li><span><kbd>↓</kbd> soft drop, <kbd>Space</kbd> drop</span></li>
         <li><span><kbd>C</kbd> hold, <kbd>P</kbd> pause</span></li>
       </ol>`;

  function showOverlay(state, info) {
    const o =
      state === 'ready'
        ? ['Ready to play?', READY_TEXT, 'Start']
        : state === 'paused'
          ? ['Paused', `<p class="intro-sub">${coarse ? 'Tap <b>Resume</b> to continue.' : 'Press <kbd>P</kbd> to continue.'}</p>`, 'Resume']
          : state === 'over'
            ? [
                'Game over',
                `<p class="intro-sub">${info.lines} lines · score ${info.score.toLocaleString('en-US')}</p>` +
                  (coarse ? '' : '<p class="intro-sub">Press <kbd>Enter</kbd> or <kbd>Space</kbd> to play again.</p>'),
                'Play again',
              ]
            : null;
    $('playOverlay').hidden = !o;
    if (!o) return;
    $('playOverlay').classList.toggle('intro', state === 'ready'); // falling blocks only on the start screen
    $('playTitle').textContent = o[0];
    $('playText').innerHTML = o[1];
    $('playGo').textContent = o[2];
    $('playOverlay').dataset.state = state;
  }

  const statsEl = $('agentStats');
  const game = startVisualGame({
    chooser: choosers[$('agent').value],
    hold: true,
    human: !$('mlToggle').checked,
    msPerRow: 45,
    imagePath: 'images/',
    onState: showOverlay,
    onStats: (s) => {
      statsEl.textContent = s.human
        ? `you · game ${s.games} · lines ${s.lines} · pieces ${s.pieces} · best ${s.bestLines} lines`
        : `game ${s.games} · lines ${s.lines} · pieces ${s.pieces} · holds ${s.holds} · best ${s.bestLines} lines`;
    },
  });

  function applyMode() {
    const ml = $('mlToggle').checked;
    document.body.classList.toggle('human', !ml);
    $('mlHint').innerHTML = ml ? 'The network is playing. Turn off to play yourself.' : 'You are playing. Turn on to let the network play.';
    if (game.isHuman() === ml) game.setHuman(!ml);
    save();
  }
  document.body.classList.toggle('human', !$('mlToggle').checked);
  $('mlHint').innerHTML = $('mlToggle').checked ? 'The network is playing. Turn off to play yourself.' : 'You are playing. Turn on to let the network play.';

  $('mlToggle').addEventListener('change', (e) => {
    e.target.blur(); // so Space and the arrows go to the game, not the switch
    applyMode();
  });

  $('agent').addEventListener('change', (e) => {
    e.target.blur();
    game.setChooser(choosers[e.target.value]);
    if (!$('mlToggle').checked) {
      // picking a player means you want to watch it: turn ML on
      $('mlToggle').checked = true;
      applyMode();
    }
    save();
  });

  $('playGo').addEventListener('click', (e) => {
    e.currentTarget.blur();
    const state = $('playOverlay').dataset.state;
    game.press(state === 'paused' ? 'pause' : state === 'over' ? 'restart' : 'start');
    if (coarse) $('gameContainer').scrollIntoView({ block: 'end', behavior: 'smooth' });
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) game.pause(true);
  });

  // touch buttons: tap to act; hold left/right to repeat, hold down to soft drop
  for (const btn of document.querySelectorAll('#touchPad button')) {
    const action = btn.dataset.key;
    let timer = null;
    const stop = () => {
      clearInterval(timer);
      timer = null;
      if (action === 'down') game.softDrop(false);
    };
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (action === 'down') {
        game.softDrop(true);
        return;
      }
      game.press(action);
      if (action === 'left' || action === 'right') {
        const t0 = performance.now();
        timer = setInterval(() => {
          if (performance.now() - t0 >= 160) game.press(action);
        }, 45);
      }
    });
    for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) btn.addEventListener(ev, stop);
  }
</script>
</body>

</html>
