<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tetris</title>
</head>

<body>
    <div id="wrapper">
        <div id="gameContainer"></div>
        <div id="gameStuff">
            <div id="nextTetromino">
            </div>
            <div id="score">
                <div id="name">Lines cleared:</div>
                <div id="scoreBoard">0</div>
            </div>
            <div class="agent-panel">
  <label for="agent">Ko igra</label>
  <select id="agent">
    <option value="search">Pretraga + naucene tezine (Faza 1)</option>
    <option value="value">Mreza vrijednosti - regresija</option>
    <option value="rank">Ranking mreza - RankNet</option>
    <option value="dagger">Ranking mreza + DAgger, 2 poteza</option>
  </select>
  <div id="agentStats"></div>
</div>
        </div>
    </div>
    </div>
    <script type="module">
  import { startVisualGame } from './src/tetris-visual.js';
  import { chooseMove } from './src/tetris-ai.js';
  import { loadValueNet, chooseValueMove } from './src/tetris-policy.js';

  const json = (f) => fetch(f).then((r) => r.json());
  const weights = (await json('./weights.json')).weights;

  const nets = {};
  async function chooserFor(kind) {
  if (kind === 'search') {
    return (b, c, n) => chooseMove(b, c, n, weights, { lookahead: true });
  }
  const files = {
    value: './value-model.json',
    rank: './rank-model.json',
    dagger: './rank-dagger.json',
  };
  nets[kind] ??= loadValueNet(await json(files[kind]));
  const net = nets[kind];
  return (b, c, n) => chooseValueMove(b, c, net, { next: n, lookahead: true });
}

  const statsBox = document.getElementById('agentStats');
  const game = startVisualGame({
    weights,
    msPerRow: 45,
    lookahead: true,
    imagePath: 'images/',
    onStats: (s) => {
      statsBox.textContent =
        `linije: ${s.lines}   figure: ${s.pieces}   partija: ${s.games}` +
        `   najbolje: ${s.bestLines}` +
        (s.finishedGames ? `   prosjek: ${s.avgLines.toFixed(1)}` : '');
    },
  });

  const select = document.getElementById('agent');
  select.addEventListener('change', async () => {
    select.disabled = true;
    game.setChooser(await chooserFor(select.value));
    select.disabled = false;
  });
</script>
</body>

</html>
