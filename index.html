<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="nav.css">
    <title>Tetris</title>
</head>

<body>
    <nav class="topnav" aria-label="Main">
      <a class="topnav-brand" href="index.html"><span class="topnav-logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>Tetris ML</span></a>
      <ul class="topnav-links">
        <li><a href="index.html" aria-current="page">Play</a></li>
        <li><a href="presentation.html">How it works</a></li>
        <li><a href="learning.html">Watch it learn</a></li>
      </ul>
    </nav>

    <div id="wrapper">
        <div id="gameContainer"></div>
        <div id="gameStuff">
            <div id="holdTetromino"></div>
            <div id="nextTetromino">
            </div>
            <div id="score">
                <div id="name">Score</div>
                <div id="scoreBoard">0</div>
            </div>
            <div class="agent-panel">
  <label for="agent">Ko igra</label>
  <select id="agent">
    <option value="dqn2">Neural network + lookahead</option>
    <option value="dqn">Neural network (DQN)</option>
    <option value="bot">Bot (search)</option>
  </select>
  <div id="agentStats"></div>
</div>
        </div>
    </div>

<script type="module">
  import { startVisualGame } from './src/tetris-visual.js';
  import { chooseMoveAction } from './src/tetris-ai.js';
  import { loadDqn, chooseDqnAction } from './src/tetris-dqn.js';

  const json = (f) => fetch(f).then((r) => r.json());
  const weights = (await json('./weights.json')).weights;
  const net = loadDqn(await json('./dqn-model.json'));

  // every player may use the hold box: `hold` is { held, canHold }
  const choosers = {
    dqn2: (board, cur, next, hold) => chooseDqnAction(board, cur, net, next, hold, { lookahead: true }),
    dqn: (board, cur, next, hold) => chooseDqnAction(board, cur, net, next, hold),
    bot: (board, cur, next, hold) => chooseMoveAction(board, cur, next, weights, hold, { lookahead: true }),
  };

  const statsEl = document.getElementById('agentStats');
  const game = startVisualGame({
    chooser: choosers.dqn2,
    hold: true,
    msPerRow: 45,
    imagePath: 'images/',
    onStats: (s) => {
      statsEl.textContent = `game ${s.games} · lines ${s.lines} · pieces ${s.pieces} · holds ${s.holds} · best ${s.bestLines} lines`;
    },
  });

  document.getElementById('agent').addEventListener('change', (e) => {
    game.setChooser(choosers[e.target.value]);
  });
</script>
</body>

</html>
